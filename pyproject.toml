[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnist-nn"
version = "0.1.0"
description = 'MNIST Pattern Recognition using various machine learning algorithms'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["mnist", "machine learning", "neural networks", "pattern recognition"]
authors = [
  { name = "CheesyChocolate", email = "dev@behnamlal.xyz" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "scikit-learn>=1.0.0",
  "matplotlib>=3.5.0",
  "numpy>=1.20.0",
  "pandas>=1.3.0",
  "argparse>=1.4.0",
]

[project.urls]
Documentation = "https://github.com/CheesyChocolate/mnist-nn#readme"
Issues = "https://github.com/CheesyChocolate/mnist-nn/issues"
Source = "https://github.com/CheesyChocolate/mnist-nn"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.envs.default]
installer = "uv"
dependencies = [
  "scikit-learn>=1.0.0",
  "matplotlib>=3.5.0",
  "numpy>=1.20.0",
  "pandas>=1.3.0",
]

[tool.coverage.run]
source_pkgs = ["src"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
